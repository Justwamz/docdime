services:
  - type: web
    name: docdime
    env: node
    region: frankfurt
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma db push && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: docdime
          property: connectionString
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        value: https://docdime.onrender.com
      - key: NEXT_PUBLIC_APP_URL
        value: https://docdime.onrender.com
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_BUCKET_NAME
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: NEXT_PUBLIC_VAPID_PUBLIC_KEY
        value: BHHc5xaAhwzO092f2Azg009X0u9sRolnU5tqxNAixPL9ZFCWFHqTYOsaAlUAKmh6XzaBwMFytSvXB_0SQ5iRNMY
      - key: VAPID_PRIVATE_KEY
        value: 01dC8GILYCNdUGcDv5x0-l8zDsAoLus-ynsfx1_2P8k
      - key: VAPID_SUBJECT
        value: mailto:admin@docdime.com
